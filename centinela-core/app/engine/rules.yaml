# Catálogo de reglas deterministas de CENTINELA.
#
# Cada regla se compila una sola vez al arrancar (ver engine/rules.py).
# El orden importa: se evalúa en el orden declarado y la primera regla que
# haga match decide el veredicto (BLOCK). Si ninguna hace match, el
# veredicto es ALLOW.
#
# category: sqli | xss | traversal | cmdi | scanner | bruteforce
# severity: baja | media | alta | critica

rules:
  - id: CNT-SQLI-001
    category: sqli
    severity: critica
    technique_id: T1190
    description: "Tautología clásica de SQL injection (' OR '1'='1)"
    pattern: "(?i)('|%27)\\s*(or|and)\\s*('|%27)?\\s*1\\s*('|%27)?\\s*=\\s*('|%27)?\\s*1"

  - id: CNT-SQLI-002
    category: sqli
    severity: critica
    technique_id: T1190
    description: "UNION SELECT típico de extracción de datos vía SQLi"
    pattern: "(?i)union(\\s|%20)+select"

  - id: CNT-SQLI-003
    category: sqli
    severity: alta
    technique_id: T1190
    description: "Comentario SQL para truncar la consulta original (-- o #)"
    pattern: "(?i)(--|#)\\s*$|/\\*.*\\*/"

  - id: CNT-SQLI-004
    category: sqli
    severity: alta
    technique_id: T1190
    description: "Funciones de retardo usadas para SQLi a ciegas (SLEEP/BENCHMARK)"
    pattern: "(?i)(sleep|benchmark)\\s*\\("

  - id: CNT-XSS-001
    category: xss
    severity: alta
    technique_id: T1059.007
    description: "Etiqueta <script> inyectada en parámetros o cuerpo"
    pattern: "(?i)<script[^>]*>"

  - id: CNT-XSS-002
    category: xss
    severity: media
    technique_id: T1059.007
    description: "Manejador de evento inline típico de XSS (onerror=, onload=)"
    pattern: "(?i)on(error|load|click|mouseover)\\s*="

  - id: CNT-XSS-003
    category: xss
    severity: media
    technique_id: T1059.007
    description: "Esquema javascript: usado para ejecutar script desde un atributo"
    pattern: "(?i)javascript\\s*:"

  # RCE (cmdi) se evalúa ANTES que LFI (traversal): un payload como
  # "; cat /etc/passwd" coincide con ambas y la categoría correcta es ejecución
  # de comandos (T1059), no lectura de archivos. Ver
  # tests/test_rules.py::test_command_injection_is_blocked.
  - id: CNT-CMDI-001
    category: cmdi
    severity: critica
    technique_id: T1059
    description: "Encadenado de comandos de shell (;, |, &&) junto a binarios típicos"
    pattern: "(?i)(;|\\||&&)\\s*(cat|ls|whoami|id|curl|wget|nc|bash|sh)\\b"

  - id: CNT-CMDI-002
    category: cmdi
    severity: alta
    technique_id: T1059
    description: "Sustitución de comandos vía backticks o $()"
    pattern: "`[^`]+`|\\$\\([^)]+\\)"

  - id: CNT-TRAVERSAL-001
    category: traversal
    severity: critica
    technique_id: T1083
    description: "Secuencia ../ para escapar del directorio base (path traversal / LFI)"
    pattern: "(\\.\\./|\\.\\.%2f|%2e%2e/){2,}"

  - id: CNT-TRAVERSAL-002
    category: traversal
    severity: alta
    technique_id: T1083
    description: "Lectura directa de archivos sensibles del sistema"
    pattern: "(?i)(etc/passwd|boot\\.ini|win\\.ini|proc/self/environ)"

  - id: CNT-SCANNER-001
    category: scanner
    severity: baja
    technique_id: T1595
    description: "User-Agent de herramientas automatizadas de escaneo"
    pattern: "(?i)(sqlmap|nikto|nmap|masscan|acunetix|nessus)"
    applies_to: headers

  - id: CNT-SCANNER-002
    category: scanner
    severity: media
    technique_id: T1595.002
    description: "Sondeo de rutas administrativas o de configuración comunes"
    pattern: "(?i)/(\\.git/|\\.env|wp-admin|phpmyadmin|admin/config)"

  - id: CNT-BRUTEFORCE-001
    category: bruteforce
    severity: media
    technique_id: T1110
    description: "Intento de acceso a endpoint de login con credenciales por defecto"
    pattern: "(?i)(username|usuario)=admin.*(password|clave)=(admin|123456|root)"
