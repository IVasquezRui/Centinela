networks:
  # Red de borde: gateway + objetivos de laboratorio + frontend + simulador.
  edge-net:
    driver: bridge
  # Red de datos: SOLO centinela-core <-> centinela-db (evidencia aislada).
  data-net:
    driver: bridge
    internal: true
  # Red privada del objetivo A: SOLO gov-pago <-> gov-mysql.
  targets-db-net:
    driver: bridge
    internal: true

volumes:
  pgdata_centinela:
  gov_mysql_data:

# ---------------------------------------------------------------------
# Secretos: se montan como archivos en /run/secrets dentro del contenedor.
# NUNCA se escriben en .env ni en docker-compose.yml (ver secrets/README.md
# y scripts/gen-secrets.sh). Los servicios los leen con la convención
# oficial *_FILE (postgres/mysql) o con app/config.py::read_secret().
# ---------------------------------------------------------------------
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  gov_mysql_root_password:
    file: ./secrets/gov_mysql_root_password.txt
  gov_app_password:
    file: ./secrets/gov_app_password.txt
  deepseek_api_key:
    file: ./secrets/deepseek_api_key.txt

services:
  # -----------------------------------------------------------------
  # Base de datos de inteligencia (eventos, reglas, auditoría, ATT&CK)
  # -----------------------------------------------------------------
  centinela-db:
    image: postgres:16-alpine
    container_name: centinela_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-centinela}
      # La contraseña NO viaja en texto plano por variables de entorno ni
      # queda visible en `docker inspect` del entorno: llega como archivo.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-centinela}
    secrets:
      - postgres_password
    volumes:
      - pgdata_centinela:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-centinela} -d ${POSTGRES_DB:-centinela}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------------------------------------------------------
  # CENTINELA core: gateway inline (8080) + API SOC/Observatorio (3000)
  # -----------------------------------------------------------------
  centinela-core:
    build: ./centinela-core
    container_name: centinela_core
    restart: unless-stopped
    # Hardening (auditoría Fase 3): sistema de archivos de solo lectura y
    # límites de recursos. NOTA: se omiten `user:` no-root y `cap_drop: ALL`
    # porque los Docker secrets se montan con permisos 600 del usuario del
    # host, ilegibles para un uid no-root o sin CAP_DAC_OVERRIDE.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0
    env_file:
      - .env
    environment:
      # centinela-core se conecta SIEMPRE como "centinela_app" (rol de mínimos
      # privilegios creado por db/init/03_grants.sh), nunca como el
      # superusuario ${POSTGRES_USER} — conectarse como admin anularía en la
      # práctica los REVOKE de auditoría, aunque existan en la base.
      # app/config.py lee este mismo secreto del superusuario y deriva la
      # contraseña real de centinela_app (sha256, ver secrets/README.md), así
      # que la credencial no aparece en `docker inspect` ni en `ps`/logs y no
      # hace falta un segundo secreto.
      DATABASE_URL: postgresql+asyncpg://centinela_app@centinela-db:5432/${POSTGRES_DB:-centinela}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      ML_MODEL_PATH: ${ML_MODEL_PATH:-/app/ml/model/nsl_kdd_rf.joblib}
      # Lista de CIDR cuyos X-Forwarded-For se aceptan (vacío = no confiar en
      # ninguna cabecera de proxy: evita suplantación de IP de origen).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      API_KEY: ${API_KEY:-}
      TARGET_GOV_PAGO_URL: http://gov-pago:80
      TARGET_TICKETS_URL: http://tickets:4000
    secrets:
      - postgres_password
      - deepseek_api_key
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ./ml/model:/app/ml/model:ro
    networks:
      - edge-net
      - data-net
    depends_on:
      centinela-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -----------------------------------------------------------------
  # Panel SOC + Observatorio público
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-3000}
        VITE_API_KEY: ${API_KEY:-}
    container_name: centinela_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    networks:
      - edge-net
    depends_on:
      - centinela-core
    healthcheck:
      # nginx (alpine/busybox) sirve los estáticos; se declara sano cuando
      # responde el index real, no solo cuando el proceso vive.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # -----------------------------------------------------------------
  # Objetivo vulnerable A: gov-pago (PHP + MySQL) — SIN puertos publicados
  # -----------------------------------------------------------------
  gov-mysql:
    image: mysql:8.0
    container_name: target_gov_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/gov_mysql_root_password
      MYSQL_DATABASE: ${GOV_MYSQL_DATABASE:-tributos_db}
      # Cuenta de aplicación (débil/excesiva a propósito, ver db.php) creada
      # por el mecanismo nativo de la imagen.
      MYSQL_USER: gov_app
      MYSQL_PASSWORD_FILE: /run/secrets/gov_app_password
    secrets:
      - gov_mysql_root_password
      - gov_app_password
    volumes:
      - gov_mysql_data:/var/lib/mysql
      - ./targets/php-tributos/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - targets-db-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$(cat /run/secrets/gov_mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  gov-pago:
    build: ./targets/php-tributos
    container_name: target_gov_pago
    restart: unless-stopped
    environment:
      MYSQL_HOST: gov-mysql
      MYSQL_DATABASE: ${GOV_MYSQL_DATABASE:-tributos_db}
      GOV_APP_USER: gov_app
      GOV_APP_PASSWORD_FILE: /run/secrets/gov_app_password
    secrets:
      - gov_app_password
    networks:
      - edge-net
      - targets-db-net
    depends_on:
      gov-mysql:
        condition: service_healthy
    healthcheck:
      # php:8.1-apache no trae curl/wget; se comprueba con el propio PHP.
      # No basta con que Apache acepte conexiones (fsockopen): eso no detecta
      # si la app puede hablar con MySQL. Se pide consulta.php de verdad y se
      # falla si la respuesta trae un error de PHP — así un problema de
      # conexión a la base de datos deja el servicio unhealthy en vez de
      # healthy-pero-roto (así se detectó el bug de 'root'@'%' de arriba).
      test:
        - "CMD-SHELL"
        - "php -r '$$r = @file_get_contents(\"http://127.0.0.1/consulta.php?cedula=V11111111\"); exit($$r !== false && strpos($$r, \"Fatal error\") === false ? 0 : 1);'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Deliberadamente sin "ports:" — solo alcanzable a través del gateway.

  # -----------------------------------------------------------------
  # Objetivo vulnerable B: tickets (Node.js) — SIN puertos publicados
  # -----------------------------------------------------------------
  tickets:
    build: ./targets/node-tickets
    container_name: target_tickets_node
    restart: unless-stopped
    networks:
      - edge-net
    healthcheck:
      # Comprueba que el proceso HTTP responde de verdad (status < 500) en 4000.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/tickets',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Deliberadamente sin "ports:" — solo alcanzable a través del gateway.

  # -----------------------------------------------------------------
  # Simulador de tráfico (legítimo + malicioso) — solo bajo demanda
  # -----------------------------------------------------------------
  attacker-sim:
    build: ./attacker-sim
    container_name: centinela_attacker_sim
    profiles: ["demo"]
    environment:
      GATEWAY_URL: http://centinela-core:8080
    networks:
      - edge-net
    depends_on:
      - centinela-core
