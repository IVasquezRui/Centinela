<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>CENTINELA — Panel SOC</title>
    <script>
      // Aplica el tema ANTES del primer paint: si esto viviera en React,
      // la página nacería en el tema por defecto y "saltaría" al correcto
      // una vez hidratada (flash visible, sobre todo en modo oscuro -> claro).
      (function () {
        try {
          var stored = localStorage.getItem("centinela-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
